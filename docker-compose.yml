# Runs the site on the VPS. Ports 80/443 are the normal web ports.
services:
  web:
    build:
      context: https://github.com/reynazech/Todoapp.git#main
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - caddy_data:/data

# Keeps the HTTPS certificates between restarts.
volumes:
  caddy_data:
